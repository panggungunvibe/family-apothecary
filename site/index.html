<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f1"><meta name="description" content="支持浏览器本地 OCR 的百子柜式家庭药品收纳与效期管理。"><title>家庭药箱</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cabinet-receipt.css"><link rel="stylesheet" href="mobile.css"></head>
<body>
<header class="header"><a class="brand" href="./"><span class="brandmark">✚</span><span>家庭药箱<small>FAMILY APOTHECARY</small></span></a><nav><button class="nav-item active" data-nav="cabinet">我的药柜</button><button class="nav-item" data-nav="expiry">效期管理<span id="nav-count"></span></button></nav><span class="local-label"><i></i> 仅存于此浏览器</span><span class="mobile-storage"><i></i> 本机存储</span></header>
<main><section class="hero"><h1 id="page-title">希望你常备，但不常用</h1></section>
<section class="workspace"><div class="toolbar"><div id="tabs" role="group" aria-label="药品分类"></div><div class="toolbar-actions"><label class="search"><span>⌕</span><input id="search" type="search" enterkeyhint="search" placeholder="搜索药品名称" autocomplete="off" aria-label="搜索药品名称"><kbd>⌘ K</kbd></label><button class="add-button" id="add">＋ 拍照入柜</button></div></div>
<div id="search-results" class="search-results" hidden></div>
<div id="cabinet-view"><div class="cabinet-heading"><span>我的百子柜</span><small id="cabinet-hint"></small></div><div id="cabinet" class="cabinet"></div></div>
<section id="expiry-view" hidden aria-label="药品效期列表"><div class="expiry-toolbar"><span id="expiry-summary"></span><select id="all-status" aria-label="筛选药品效期"><option value="all">全部效期</option><option value="expired">已过期</option><option value="soon">90 天内到期</option><option value="valid">效期正常</option><option value="unknown">未填写日期</option></select></div><div class="expiry-columns"><span>药品</span><span>到期日期</span><span>剩余时间</span></div><div id="expiry-list"></div></section>
<div id="empty" class="empty" hidden>没有找到药品。<button id="reset-filter">清除筛选</button></div></section>
<footer><span>植物与配方图样仅作收纳标识</span><span>本地 OCR 不上传照片 · 保存前请核对说明书</span></footer>
</main><nav class="mobile-nav" aria-label="手机主导航"><button data-nav="cabinet" class="active" aria-label="我的药柜"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18M7 8h1m8 0h1M7 16h1m8 0h1"/></svg><span>我的药柜</span></button><button id="mobile-add" class="mobile-add" aria-label="拍照入柜"><span class="camera-disc"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l2-2h4l2 2h4a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V7a2 2 0 012-2z"/><circle cx="12" cy="12" r="4"/></svg></span><span>拍照入柜</span></button><button data-nav="expiry" aria-label="效期管理"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-9 3v3l2 1"/></svg><span>效期管理</span><i id="mobile-nav-count" aria-hidden="true"></i></button></nav><div id="toast" role="status"></div><dialog id="dialog"><div id="dialog-content"></div></dialog><script src="medicine-art.js"></script><script src="ocr.js?v=local-ocr-1"></script><script src="app.js?v=local-ocr-1"></script>
</body></html>
