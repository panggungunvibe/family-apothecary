<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f1"><meta name="description" content="家庭药品分类收纳与效期管理。"><title>家庭药箱</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cabinet-receipt.css"></head>
<body>
<header class="header"><a class="brand" href="./"><span class="brandmark">✚</span><span>家庭药箱<small>FAMILY APOTHECARY</small></span></a><nav><button class="nav-item active" data-nav="cabinet">我的药柜</button><button class="nav-item" data-nav="expiry">效期管理<span id="nav-count"></span></button></nav><span class="local-label"><i></i> 仅存于此浏览器</span></header>
<main><section class="hero"><h1 id="page-title">希望你常备，但不常用</h1></section>
<section class="workspace"><div class="toolbar"><div id="tabs" role="group" aria-label="药品分类"></div><div class="toolbar-actions"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索药品名称" autocomplete="off" aria-label="搜索药品名称"><kbd>⌘ K</kbd></label><button class="add-button" id="add">＋ 拍照入柜</button></div></div>
<div id="search-results" class="search-results" hidden></div>
<div id="cabinet-view"><div class="cabinet-heading"><span>我的百子柜</span><small id="cabinet-hint"></small></div><div id="cabinet" class="cabinet"></div></div>
<section id="expiry-view" hidden aria-label="药品效期列表"><div class="expiry-toolbar"><span id="expiry-summary"></span><select id="all-status" aria-label="筛选药品效期"><option value="all">全部效期</option><option value="expired">已过期</option><option value="soon">90 天内到期</option><option value="valid">效期正常</option><option value="unknown">未填写日期</option></select></div><div class="expiry-columns"><span>药品</span><span>到期日期</span><span>剩余时间</span></div><div id="expiry-list"></div></section>
<div id="empty" class="empty" hidden>没有找到药品。<button id="reset-filter">清除筛选</button></div></section>
<footer><span>植物图样仅作装饰</span><span>演示资料仅供体验 · 用量请核对药品说明书</span></footer>
</main><div id="toast" role="status"></div><dialog id="dialog"><div id="dialog-content"></div></dialog><script src="medicine-art.js"></script><script src="app.js"></script>
</body></html>
